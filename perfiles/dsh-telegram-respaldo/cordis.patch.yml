# Perfil dsh-telegram-respaldo (RESERVA del chat de Telegram, PC y VPS) - DeepSeek.
# Es una copia de dsh-telegram con OTRO PROVEEDOR: se usa solo cuando MiniMax se queda
# sin cupo (429/402), para que un bajon de cuota no corte la conversacion.
# Las mismas herramientas, los mismos permisos y el mismo plugin: solo cambia el modelo.
# Se instala en ~/.dsh/profiles/<nombre> con install.sh (VPS) o install.ps1 (PC).
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-official
    model: deepseek-flash
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access
- id: skill-filesystem
  name: "@deepseek-ai/dsh-skill-filesystem"
  config:
    customSkillDirs:
      - "skills"
- id: llm-deepseek
  name: "@deepseek-ai/dsh-llm-deepseek-api-key"
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    thinking: disabled
    reasoningEffort: off
    maxTokens: 8192
    models:
      - id: deepseek-flash
        name: DeepSeek-V4.1-Flash
        contextWindow: 1048576
        maxTokens: 393216
        inputModalities:
          - text
          - image
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      minimax:
        displayName: MiniMax
        apiKeyEnv: MINIMAX_2_API_KEY
        api: openai-completions
        baseURL: https://api.minimax.io/v1
        reasoning: low
        models:
          - id: MiniMax-M3
            name: MiniMax M3
            contextWindow: 1000000
            maxTokens: 512000
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max

# El plugin del perfil: inyecta PERFIL-TG + definiciones + identidad en cada sesion
# y registra las herramientas del canal, el WIP compartido y los acuerdos.
- insert:
    - id: estudio
      name: "dsh-estudio-plugin"
      config:
        perfil: dsh-telegram-respaldo
