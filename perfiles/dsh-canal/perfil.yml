# Perfil DSH dsh-canal del estudio de videos (13-nov-2026).
nombre: dsh-canal
descripcion: El canal entre bots: D1 (memoria) + Realtime (push) + API (accionar) + R2 (ficheros de 72 h). Telegram queda para el autor.
base: dsh-telegram
proveedor: minimax
modelo: MiniMax-M3
reasoningEffort: high
herramientas: estudio          # solo las herramientas locales del estudio (nada de shells remotos)
canales:                      # los bots se coordinan por el canal (no por Telegram)
  - canal
canal:
  url: https://estudio-canal.jeffaporta.workers.dev
  api: /api
  realtime: /rt
  vida_horas: 72
prohibido:                    # vetado por la politica de comunicacion (POLITICA-COMUNICACION.md)
  - ssh
  - sftp
  - scp
  - rsync
  - netcat
  - sockets
  - carpetas-compartidas
permisos:
  leer: true
  escribir: true
  ejecutar: true
parche: cordis.patch.yml
definiciones: definiciones.md
