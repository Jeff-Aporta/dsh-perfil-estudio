# Perfil DSH dsh-telegram-produccion del estudio de videos (13-nov-2026).
nombre: dsh-telegram-produccion
descripcion: Puede trabajar sobre la produccion (taller, cola, mp4) con las reglas del estudio.
base: dsh-telegram
proveedor: minimax
modelo: MiniMax-M3.1-Flash-Preview
reasoningEffort: medium
herramientas: estudio          # solo las herramientas locales del estudio (nada de shells remotos)
canales:                      # los bots se comunican UNICAMENTE por aqui
  - telegram
prohibido:                    # vetado por la politica de comunicacion (POLITICA-COMUNICACION.md)
  - ssh
  - sftp
  - scp
  - rsync
  - netcat
  - sockets
  - carpetas-compartidas
permisos:
  leer: true
  escribir: true
  ejecutar: true
parche: cordis.patch.yml
definiciones: definiciones.md
